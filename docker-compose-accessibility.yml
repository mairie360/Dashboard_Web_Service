# RGAA accessibility stack of the Dashboard front (MAIR-316), run by accessibility_test.sh and by
# the rgaa job of mairie360/CICD promote-prod.yml (IMAGE_REF=<image>@<staging digest>).
#
# Same upstream chain as docker-compose-security.yml (database + init-test.sql, Redis, Core,
# Project and Calendar APIs, BFF_Dashboard), plus init-accessibility.sql for the RGAA states, the
# front on ${IMAGE_REF} and the RGAA runner of mairie360/CICD (cicd-repo/tests/a11y) instead of
# ZAP. It plays the states of rgaa.yaml with a JWT signed by the engine and writes rgaa-report/.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF Dashboard, puis à BFF User, aux BFFs métier et aux APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

# Own project name: the default one (the folder) is shared with docker-compose.yml, whose
# postgres-data / redis-data volumes `down -v` would otherwise delete.
name: dashboard-front-a11y

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: dashboard-front-a11y-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: dashboard-front-a11y-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: dashboard-front-a11y-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  seeder-a11y:
    image: postgres:18-alpine
    container_name: dashboard-front-a11y-seeder-a11y
    depends_on:
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./init-accessibility.sql:/init-accessibility.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-accessibility.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: dashboard-front-a11y-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.3.0}
    container_name: dashboard-front-a11y-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'i=0; until curl -fsS --connect-timeout 2 --max-time 5 http://core-api:3000/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 90 attempts"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:1.2.0}
    container_name: dashboard-front-a11y-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3001"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur project-api-ready ci-dessous.

  project-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'i=0; until curl -fsS --connect-timeout 2 --max-time 5 http://project-api:3001/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "project-api not ready after 90 attempts"; exit 1; fi;
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:1.3.0}
    container_name: dashboard-front-a11y-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3002
      PUBLIC_URL: http://calendar-api:3002
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
      # Calendar API also throttles each client IP with a token bucket (actix-governor, 10 req/s, burst 50):
      # "0" disables it, otherwise a load test turns into 429s relayed as 502 by the BFFs.
      RATE_LIMIT_PER_SECOND: "0"
    expose:
      - "3002"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur calendar-api-ready ci-dessous.

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'i=0; until curl -fsS --connect-timeout 2 --max-time 5 http://calendar-api:3002/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "calendar-api not ready after 90 attempts"; exit 1; fi;
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  bff-dashboard:
    image: ${BFF_DASHBOARD_IMAGE:-ghcr.io/mairie360/bff-dashboard:2.1.0}
    container_name: dashboard-front-a11y-bff-dashboard
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4007
      # Same secret as the APIs: BFF_Dashboard verifies the session tokens with it and refuses to start without it.
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
      PROJECT_API_URL: http://project-api:3001
      # Since MAIR-525 BFF_Dashboard reads Core, Project and Calendar APIs directly (no other BFF) and refuses
      # to start without one of these URLs.
      CALENDAR_API_URL: http://calendar-api:3002
    expose:
      - "4007"
    networks:
      - backend

  bff-dashboard-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-bff-dashboard-ready
    depends_on:
      bff-dashboard:
        condition: service_started
    command: >
      sh -c 'i=0; until curl -fsS --connect-timeout 2 --max-time 5 http://bff-dashboard:4007/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "bff-dashboard not ready after 90 attempts"; exit 1; fi;
      echo "waiting for bff-dashboard..."; sleep 2; done; echo "bff-dashboard ready"'
    networks:
      - backend

  dashboard-front:
    # The image under test: <image>@<staging digest> from promote-prod.yml, or the image
    # accessibility_test.sh built locally. Never rebuilt here.
    image: ${IMAGE_REF:?IMAGE_REF is set by accessibility_test.sh}
    container_name: dashboard-front-a11y-front
    depends_on:
      bff-dashboard-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      DASHBOARD_BFF_URL: http://bff-dashboard:4007
      # Reserved test destination: anonymous readiness returns307, without
      # contacting a real Login. Authenticated ZAP requests are unchanged.
      LOGIN_FRONT_URL: http://login.invalid/
      DASHBOARD_FRONT_URL: http://dashboard-front:5000/
    expose:
      - "5000"
    networks:
      - backend
    # curl est installé dans l'image runner (seul un statut >= 400 fait échouer curl -f).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  a11y:
    image: ${A11Y_RUNNER_IMAGE:?A11Y_RUNNER_IMAGE comes from cicd-repo/tests/a11y/runner-image}
    # Run as the caller (accessibility_test.sh exports them), so that rgaa-report/ and
    # .rgaa-ai-cache/ are not root-owned in the checkout.
    user: "${RGAA_UID:-0}:${RGAA_GID:-0}"
    container_name: dashboard-front-a11y-runner
    depends_on:
      dashboard-front:
        condition: service_healthy
    command: ["sh", "/engine/run.sh"]
    environment:
      RGAA_MIN_RATE: ${RGAA_MIN_RATE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      RGAA_AI_MODEL: ${RGAA_AI_MODEL:-}
    volumes:
      - ./cicd-repo/tests/a11y:/engine:ro
      - ./rgaa.yaml:/scope/rgaa.yaml:ro
      - ./rgaa-report:/report
      - ./.rgaa-ai-cache:/ai-cache
    networks:
      - backend
