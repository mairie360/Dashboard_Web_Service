# Accessibility (RGAA) test stack of the dashboard front (MAIR-316 / MAIR-317).
#
#   ./accessibility_test.sh        (local: builds the front when IMAGE_REF is empty)
#
# Same stack as docker-compose-security.yml (database + seed, core / project / calendar APIs,
# bff-user / bff-project / bff-calendar, bff-dashboard), with the front on ${IMAGE_REF}
# (staging-<sha> in the CI, release-prod job) and, instead of ZAP, the runner of the RGAA engine of
# mairie360/CICD (cicd-repo/tests/a11y), which plays the states of rgaa.yaml and writes
# rgaa-report/. The states are played as the users of init-test.sql / init-accessibility.sql, with
# an accessToken the engine signs with the JWT_SECRET below (session / users of rgaa.yaml).
# Exit codes: 0 ok, 1 state unreachable / undeclared criterion, 2 invalid rgaa.yaml, 3 rate below
# RGAA_MIN_RATE.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF Dashboard, puis à BFF User, aux BFFs métier et aux APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: dashboard-front-a11y-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: dashboard-front-a11y-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: dashboard-front-a11y-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  # Data of the RGAA states (projects, tasks, events), on top of init-test.sql: only this stack
  # needs it, the ZAP / k6 stacks keep the minimal seed.
  seeder-a11y:
    image: postgres:18-alpine
    container_name: dashboard-front-a11y-seeder-a11y
    depends_on:
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./init-accessibility.sql:/init-accessibility.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-accessibility.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: dashboard-front-a11y-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    container_name: dashboard-front-a11y-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:0.5.1}
    container_name: dashboard-front-a11y-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
    expose:
      - "3001"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur project-api-ready ci-dessous.

  project-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://project-api:3001/health >/dev/null; do
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:0.6.1}
    container_name: dashboard-front-a11y-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3002
      PUBLIC_URL: http://calendar-api:3002
    expose:
      - "3002"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur calendar-api-ready ci-dessous.

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar-api:3002/health >/dev/null; do
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.5.0}
    container_name: dashboard-front-a11y-bff-user
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
    expose:
      - "4000"
    networks:
      - backend

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  bff-project:
    image: ${BFF_PROJECT_IMAGE:-ghcr.io/mairie360/bff-project:0.4.0}
    container_name: dashboard-front-a11y-bff-project
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4001
      REDIS_URL: redis://redis:6379
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      PROJECT_API_URL: project-api
      PROJECT_API_PORT: 3001
      PROJECT_API_BASE_PATH: http://project-api:3001
      USER_BFF_URL: http://bff-user:4000
    expose:
      - "4001"
    networks:
      - backend

  bff-project-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-bff-project-ready
    depends_on:
      bff-project:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-project:4001/health >/dev/null; do
      echo "waiting for bff-project..."; sleep 2; done; echo "bff-project ready"'
    networks:
      - backend

  bff-calendar:
    image: ${BFF_CALENDAR_IMAGE:-ghcr.io/mairie360/bff-calendar:0.4.0}
    container_name: dashboard-front-a11y-bff-calendar
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4002
      REDIS_URL: redis://redis:6379
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      CALENDAR_API_URL: calendar-api
      CALENDAR_API_PORT: 3002
      CALENDAR_API_BASE_PATH: http://calendar-api:3002/api
    expose:
      - "4002"
    networks:
      - backend

  bff-calendar-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-bff-calendar-ready
    depends_on:
      bff-calendar:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-calendar:4002/health >/dev/null; do
      echo "waiting for bff-calendar..."; sleep 2; done; echo "bff-calendar ready"'
    networks:
      - backend

  bff-dashboard:
    image: ${BFF_DASHBOARD_IMAGE:-ghcr.io/mairie360/bff-dashboard:1.1.0}
    container_name: dashboard-front-a11y-bff-dashboard
    depends_on:
      seeder-a11y:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      bff-user-ready:
        condition: service_completed_successfully
      bff-project-ready:
        condition: service_completed_successfully
      bff-calendar-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4007
      USER_BFF_URL: http://bff-user:4000
      PROJECT_BFF_URL: http://bff-project:4001
      CALENDAR_BFF_URL: http://bff-calendar:4002
      CORE_API_URL: http://core-api:3000
      PROJECT_API_URL: http://project-api:3001
    expose:
      - "4007"
    networks:
      - backend

  bff-dashboard-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-a11y-bff-dashboard-ready
    depends_on:
      bff-dashboard:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-dashboard:4007/health >/dev/null; do
      echo "waiting for bff-dashboard..."; sleep 2; done; echo "bff-dashboard ready"'
    networks:
      - backend

  dashboard-front:
    # Published image (staging-<sha> in the CI); accessibility_test.sh builds one locally.
    image: ${IMAGE_REF:?IMAGE_REF must name the front image to test}
    container_name: dashboard-front-a11y-front
    depends_on:
      bff-dashboard-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      DASHBOARD_BFF_URL: http://bff-dashboard:4007
      # Every front URL of src/lib/front-urls.ts: without them the shell hides its links and the
      # header menu cannot log out. The other fronts are not in the stack (dummy hosts); the
      # dashboard points at itself.
      LOGIN_FRONT_URL: http://login-front.invalid/
      DASHBOARD_FRONT_URL: http://dashboard-front:5000/
      PROJECT_FRONT_URL: http://project-front.invalid/
      CALENDAR_FRONT_URL: http://calendar-front.invalid/
      MESSAGE_FRONT_URL: http://message-front.invalid/
      ELEARNING_FRONT_URL: http://elearning-front.invalid/
      SETTINGS_FRONT_URL: http://settings-front.invalid/
      ADMINISTRATION_FRONT_URL: http://administration-front.invalid/
      EMAIL_FRONT_URL: http://email-front.invalid/
      FILES_FRONT_URL: http://files-front.invalid/
    expose:
      - "5000"
    networks:
      - backend
    # curl est installé dans l'image runner (seul un statut >= 400 fait échouer curl -f).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  a11y:
    image: ${A11Y_RUNNER_IMAGE:?A11Y_RUNNER_IMAGE comes from cicd-repo/tests/a11y/runner-image}
    # Run as the caller (accessibility_test.sh exports them), so that rgaa-report/ and
    # .rgaa-ai-cache/ are not root-owned in the checkout.
    user: "${RGAA_UID:-0}:${RGAA_GID:-0}"
    container_name: dashboard-front-a11y-runner
    depends_on:
      dashboard-front:
        condition: service_healthy
    command: ["sh", "/engine/run.sh"]
    environment:
      RGAA_MIN_RATE: ${RGAA_MIN_RATE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      RGAA_AI_MODEL: ${RGAA_AI_MODEL:-}
    volumes:
      - ./cicd-repo/tests/a11y:/engine:ro
      - ./rgaa.yaml:/scope/rgaa.yaml:ro
      - ./rgaa-report:/report
      - ./.rgaa-ai-cache:/ai-cache
    networks:
      - backend
