# Stack de test de performance ISOLÉE pour le front Dashboard (Dashboard_Web_Service).
#
#   ./performance_test.sh          (local, NODE_AUTH_TOKEN exporté pour le build)
#   docker compose -f docker-compose-performance.yml up --build \
#       --abort-on-container-exit --exit-code-from k6-perf-test   (CI)
#
# k6-perf-test sort en échec si un seuil de load-test.js est dépassé.
# TARGET_IMAGE (optionnel) : image front pré-construite à tester au lieu du build local.
#
# Le front ne parle qu'à BFF Dashboard, qui agrège trois BFFs : la stack monte toute
# la chaîne amont réelle (BFF User / Project / Calendar + leurs APIs) + base partagée + redis.

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF Dashboard, puis à BFF User, aux BFFs métier et aux APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-90c22bb}
    container_name: dashboard-front-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-90c22bb}
    container_name: dashboard-front-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: dashboard-front-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: dashboard-front-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-95531e2}
    container_name: dashboard-front-perf-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-perf-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:dev-2b0d884}
    container_name: dashboard-front-perf-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3001"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur project-api-ready ci-dessous.

  project-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-perf-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://project-api:3001/health >/dev/null; do
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:dev-7486387}
    container_name: dashboard-front-perf-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3002
      PUBLIC_URL: http://calendar-api:3002
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
      # Calendar API also throttles each client IP with a token bucket (actix-governor, 10 req/s, burst 50):
      # "0" disables it, otherwise a load test turns into 429s relayed as 502 by the BFFs.
      RATE_LIMIT_PER_SECOND: "0"
    expose:
      - "3002"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur calendar-api-ready ci-dessous.

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-perf-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar-api:3002/health >/dev/null; do
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  bff-dashboard:
    image: ${BFF_DASHBOARD_IMAGE:-ghcr.io/mairie360/bff-dashboard:2.0.0}
    container_name: dashboard-front-perf-bff-dashboard
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4007
      # Same secret as the APIs: BFF_Dashboard verifies the session tokens with it and refuses to start without it.
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core-api:3000
      PROJECT_API_URL: http://project-api:3001
      # Since MAIR-525 BFF_Dashboard reads Core, Project and Calendar APIs directly (no other BFF) and refuses
      # to start without one of these URLs.
      CALENDAR_API_URL: http://calendar-api:3002
    expose:
      - "4007"
    networks:
      - backend

  bff-dashboard-ready:
    image: curlimages/curl:latest
    container_name: dashboard-front-perf-bff-dashboard-ready
    depends_on:
      bff-dashboard:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-dashboard:4007/health >/dev/null; do
      echo "waiting for bff-dashboard..."; sleep 2; done; echo "bff-dashboard ready"'
    networks:
      - backend

  dashboard-front:
    image: ${TARGET_IMAGE:-dashboard-front:perf}
    container_name: dashboard-front-perf-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-dashboard-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      DASHBOARD_BFF_URL: http://bff-dashboard:4007
      # Reserved test destination: anonymous readiness returns307, without
      # contacting a real Login. Authenticated k6 requests are unchanged.
      LOGIN_FRONT_URL: http://login.invalid/
      DASHBOARD_FRONT_URL: http://dashboard-front:5000/
    expose:
      - "5000"
    networks:
      - backend
    # curl est installé dans l'image runner (seul un statut >= 400 fait échouer curl -f).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  k6-perf-test:
    image: grafana/k6:latest
    container_name: dashboard-front-perf-k6
    depends_on:
      dashboard-front:
        condition: service_healthy
    volumes:
      - ./load-test.js:/load-test.js:ro
    environment:
      BASE_URL: http://dashboard-front:5000
      JWT_SECRET: 'b"secret"'
      PERF_USER_ID: "2"
    command: ["run", "/load-test.js"]
    networks:
      - backend
